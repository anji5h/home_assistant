services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: home-assistant-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-home_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
      - POSTGRES_MAINTENANCE_WORK_MEM=128MB
      - POSTGRES_WORK_MEM=16MB
      - POSTGRES_WAL_BUFFERS=16MB
      - POSTGRES_CHECKPOINT_TIMEOUT=15min
      - POSTGRES_MAX_WAL_SIZE=2GB
      - POSTGRES_MIN_WAL_SIZE=1GB
      - POSTGRES_MAX_CONNECTIONS=100
      - TS_TUNE_DISABLE=true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-home_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - home_assistant_network

  api:
    build:
      dockerfile: Dockerfile
    container_name: home-assistant-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home_assistant_network

volumes:
  postgres_data:
    driver: local
    name: home_assistant_postgres_data

networks:
  home_assistant_network:
    driver: bridge
